<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
  <defs>
    <linearGradient id="horizontal"><stop offset="0" stop-color="red"/><stop offset="1" stop-color="blue"/></linearGradient>
    <linearGradient id="vertical" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="gold"/><stop offset="100%" stop-color="green"/></linearGradient>
    <linearGradient id="diagonal" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#000"/><stop offset="0.3" stop-color="#f0f"/><stop offset="0.6" stop-color="#0ff"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="hard">
      <stop offset="0.25" stop-color="orange"/><stop offset="0.25" stop-color="purple"/>
      <stop offset="0.5" stop-color="purple"/><stop offset="0.5" stop-color="teal"/>
      <stop offset="0.75" stop-color="teal"/>
    </linearGradient>
    <linearGradient id="unordered">
      <stop offset="0.6" stop-color="navy"/><stop offset="0.2" stop-color="yellow"/><stop offset="1.5" stop-color="red"/>
    </linearGradient>
    <linearGradient id="user" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="240" y2="0">
      <stop offset="0" stop-color="black"/><stop offset="1" stop-color="lime"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="100" height="60" fill="url(#horizontal)"/>
  <rect x="130" y="10" width="100" height="60" fill="url(#vertical)"/>
  <rect x="10" y="90" width="100" height="60" fill="url(#diagonal)"/>
  <rect x="130" y="90" width="100" height="60" fill="url(#hard)"/>
  <rect x="10" y="170" width="100" height="60" fill="url(#unordered)"/>
  <rect x="130" y="170" width="50" height="60" fill="url(#user)"/>
  <rect x="185" y="170" width="45" height="60" fill="url(#user)"/>
</svg>
