<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" color="darkgreen">
  <rect x="0" y="0" width="50" height="50" fill="cornflowerblue"/>
  <rect x="50" y="0" width="50" height="50" fill="#f80"/>
  <rect x="100" y="0" width="50" height="50" fill="#80ff0080"/>
  <rect x="150" y="0" width="50" height="50" fill="rgb(10, 200, 30)"/>
  <rect x="0" y="50" width="50" height="50" fill="rgb(50%,0%,100%)"/>
  <rect x="50" y="50" width="50" height="50" fill="rgba(255,0,0,0.5)"/>
  <rect x="100" y="50" width="50" height="50" fill="hsl(200, 80%, 40%)"/>
  <rect x="150" y="50" width="50" height="50" fill="currentColor"/>
  <rect x="0" y="100" width="50" height="50" fill="RebeccaPurple"/>
  <rect x="50" y="100" width="50" height="50" fill="#ABCDEF" stroke="currentColor" stroke-width="4"/>
  <rect x="100" y="100" width="50" height="50" fill="transparent" stroke="black"/>
  <rect x="150" y="100" width="50" height="50" fill="hsla(0,100%,50%,.3)"/>
</svg>
